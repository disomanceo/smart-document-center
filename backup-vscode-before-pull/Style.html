<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --text: #172033;
    --muted: #64748b;
    --primary: #2457e6;
    --primary-dark: #183fb3;
    --soft: #eaf0ff;
    --border: #e2e8f0;
    --success: #15803d;
    --warning: #b45309;
    --danger: #b91c1c;
    --shadow: 0 16px 40px rgba(15, 23, 42, .08);
  }

  * { box-sizing: border-box; }

  /* แจ้งเตือนตรงกลางด้านบน */
  .sdc-top-toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translate(-50%, -20px);
    z-index: 99999;
    min-width: min(92vw, 420px);
    max-width: 92vw;
    padding: 14px 18px;
    border-radius: 999px;
    text-align: center;
    font-size: 17px;
    font-weight: 800;
    line-height: 1.35;
    opacity: 0;
    pointer-events: none;
    box-shadow: 0 18px 45px rgba(15, 23, 42, .18);
    transition: opacity .2s ease, transform .2s ease;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
  }
  .sdc-top-toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .sdc-top-toast-success { background: #ecfdf5; color: #047857; border-color: #86efac; }
  .sdc-top-toast-error { background: #fef2f2; color: #b91c1c; border-color: #fca5a5; }
  .sdc-top-toast-warning { background: #fffbeb; color: #b45309; border-color: #fcd34d; }
  .sdc-top-toast-info { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }

  #manualCategory, #searchCategory {
    position: relative;
    z-index: 2;
    pointer-events: auto !important;
    opacity: 1 !important;
  }


  body {
    margin: 0;
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  button, input, select { font-family: inherit; }

  .app-shell { min-height: 100vh; display: flex; }

  .sidebar {
    width: 270px;
    min-height: 100vh;
    padding: 22px;
    background: linear-gradient(180deg, #10204a, #172554);
    color: #fff;
    position: sticky;
    top: 0;
  }

  .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 30px; }
  .brand-icon { width: 48px; height: 48px; display: grid; place-items: center; background: rgba(255,255,255,.14); border-radius: 16px; font-size: 24px; }
  .brand h1 { margin: 0; font-size: 26px; }
  .brand p { margin: 2px 0 0; color: #cbd5e1; font-size: 13px; }

  .side-nav { display: grid; gap: 10px; }
  .nav-btn {
    border: 0;
    border-radius: 16px;
    padding: 14px 16px;
    text-align: left;
    color: #dbeafe;
    background: transparent;
    cursor: pointer;
    font-size: 16px;
  }
  .nav-btn.active, .nav-btn:hover { background: rgba(255,255,255,.15); color: #fff; }

  .main { flex: 1; padding: 24px 28px 96px; max-width: 1200px; margin: 0 auto; width: 100%; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
  .topbar h2 { margin: 0; font-size: 28px; }
  .topbar p { margin: 4px 0 0; color: var(--muted); }

  .refresh-btn, .primary-btn, .secondary-btn, .ghost-btn {
    border: 0;
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .refresh-btn, .ghost-btn { background: #fff; color: var(--primary); border: 1px solid var(--border); }
  .primary-btn { background: var(--primary); color: #fff; box-shadow: 0 10px 24px rgba(36,87,230,.22); }
  .primary-btn:hover { background: var(--primary-dark); }
  .secondary-btn { background: var(--soft); color: var(--primary); }

  .alert {
    margin-bottom: 16px;
    padding: 13px 16px;
    border-radius: 16px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    font-weight: 700;
  }
  .alert-success { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .alert-warning { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .alert-error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .alert-info { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .upload-status {
    margin-top: 14px;
    padding: 13px 16px;
    border-radius: 16px;
    font-weight: 700;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    word-break: break-word;
  }
  .upload-status-success { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
  .upload-status-warning { background: #fffbeb; color: #b45309; border-color: #fde68a; }
  .upload-status-error { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
  .upload-status-info { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  button:disabled { opacity: .65; cursor: not-allowed; }

  .client-test-status {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 14px;
    background: #f8fafc;
    border: 1px dashed #94a3b8;
    color: #334155;
    font-size: 14px;
    font-weight: 600;
  }
  .mini-btn {
    margin-top: 10px;
    padding: 9px 12px !important;
    font-size: 14px !important;
  }

  .hidden { display: none !important; }

  .page { display: none; }
  .page.active { display: block; }
  .page-title h3 { margin: 0; font-size: 24px; }
  .page-title p { margin: 5px 0 18px; color: var(--muted); }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-card, .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .stat-card { padding: 18px; }
  .stat-card span { color: var(--muted); font-size: 14px; }
  .stat-card strong { display: block; margin-top: 8px; font-size: 34px; }
  .card { padding: 20px; margin-bottom: 16px; }
  .card-head h4 { margin: 0 0 12px; font-size: 18px; }

  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  label { display: grid; gap: 7px; color: #334155; font-weight: 700; }
  input, select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    background: #fff;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(36,87,230,.12); }

  .upload-zone {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
    padding: 18px;
    border: 1.5px dashed #93c5fd;
    border-radius: 20px;
    background: #f8fbff;
    margin-bottom: 18px;
  }
  .upload-icon { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--soft); font-size: 28px; }
  .upload-zone p { margin: 4px 0 10px; color: var(--muted); }
  .upload-zone input { padding: 10px; background: #fff; }

  .action-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .analysis-box { margin-top: 16px; padding: 14px; border-radius: 16px; background: #f8fafc; border: 1px solid var(--border); line-height: 1.8; }

  .search-row { display: grid; grid-template-columns: 1.4fr .7fr .9fr auto; gap: 10px; margin-bottom: 16px; }
  .file-list { display: grid; gap: 12px; }
  .file-item { border: 1px solid var(--border); border-radius: 18px; padding: 15px; background: #fff; }
  .file-item h4 { margin: 0 0 10px; font-size: 17px; }
  .file-meta { display: flex; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: 13px; }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 5px 10px; background: #f1f5f9; color: #334155; }
  .badge.confirmed { background: #dcfce7; color: var(--success); }
  .badge.pending { background: #fef3c7; color: var(--warning); }
  .empty { color: var(--muted); padding: 18px; text-align: center; background: #f8fafc; border-radius: 16px; }
  a { color: var(--primary); font-weight: 700; text-decoration: none; }

  .bottom-nav { display: none; }

  @media (max-width: 820px) {
    .app-shell { display: block; }
    .sidebar { display: none; }
    .main { padding: 18px 14px 96px; }
    .topbar { align-items: flex-start; }
    .topbar h2 { font-size: 22px; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat-card { padding: 14px; border-radius: 18px; }
    .stat-card strong { font-size: 28px; }
    .form-grid, .search-row { grid-template-columns: 1fr; }
    .upload-zone { grid-template-columns: 1fr; }
    .action-row button { flex: 1 1 100%; }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--border);
      box-shadow: 0 -10px 30px rgba(15,23,42,.08);
    }
    .bottom-btn {
      border: 0;
      border-radius: 15px;
      background: transparent;
      color: var(--muted);
      padding: 8px 4px;
      display: grid;
      gap: 2px;
      place-items: center;
      font-size: 18px;
    }
    .bottom-btn small { font-size: 12px; }
    .bottom-btn.active { background: var(--soft); color: var(--primary); }
  }
</style>

<style>
  /* SDC upload fix v5: category fallback buttons */
  .category-field { position: relative; z-index: 10; }
  .category-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .category-chip {
    border: 1px solid #bfdbfe;
    background: #eff6ff;
    color: #1d4ed8;
    border-radius: 999px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .category-chip.active {
    background: #2457e6;
    border-color: #2457e6;
    color: #fff;
  }
  #manualCategory {
    display: block !important;
    visibility: visible !important;
    pointer-events: auto !important;
    user-select: auto !important;
    opacity: 1 !important;
    position: relative !important;
    z-index: 20 !important;
  }
  .sdc-top-toast-success {
    background: #ecfdf5 !important;
    color: #047857 !important;
    border-color: #86efac !important;
  }
  .sdc-top-toast-error {
    background: #fef2f2 !important;
    color: #b91c1c !important;
    border-color: #fca5a5 !important;
  }
</style>
